    <script>
        var questions = [
            { q: "  ,    ?", a: "   ", b: "    " },
            { q: "     ?", a: "    ", b: "   " },
            { q: "    ?", a: "    ", b: "    " },
            { q: "      ?", a: "    ", b: "    " },
            { q: "   ?", a: " //", b: "   /" },
            { q: "      ?", a: "' !'    ", b: "'...'   " },
            { q: "/     ?", a: "       ", b: "    " },
            { q: "     ?", a: "     ", b: "     " },
            { q: "     ?", a: "   ", b: "  " },
            { q: "      ?", a: "    ", b: "   " },
            { q: "     ?", a: ", ,  ", b: "SNS , ,  " },
            { q: "    ?", a: "    ", b: "     " }
        ];

        var curStep = 0;
        var scoreA = 0;
        var scoreB = 0;

        function getEl(id) { return document.getElementById(id); }

        function startTest() {
            var name = getEl("input-name").value.trim();
            if (!name) { alert("   !"); return; }
            curStep = 0; scoreA = 0; scoreB = 0;
            getEl("progress-container").classList.remove("hidden");
            getEl("screen-start").classList.add("hidden");
            getEl("screen-q").classList.remove("hidden");
            renderQ();
        }

        function renderQ() {
            var q = questions[curStep];
            var prog = ((curStep + 1) / questions.length) * 100;
            getEl("progress-bar").style.width = prog + "%";
            getEl("txt-q-num").innerText = "Q. " + (curStep + 1 < 10 ? '0' : '') + (curStep + 1) + " / " + questions.length;
            getEl("txt-q").innerText = q.q;
            getEl("txt-a").innerText = q.a;
            getEl("txt-b").innerText = q.b;
        }

        function next(ans) {
            if (ans === 'A') scoreA++;
            else scoreB++;
            curStep++;
            if (curStep < questions.length) {
                setTimeout(renderQ, 150);
            } else {
                finish();
            }
        }

        const RESULTS = [
            { // 
                name: '   ',
                badge: 'TYPE 01',
                img: './img/healing-type1.jpg',
                tags: ['#', '#', '#', '#'],
                summary: '      !      .',
                outer: "         ",
                inner: "        ",
                stats: { home: 99, emotion: 85, walk: 25, active: 30 },
                burnout: '           .',
                solution: '   +     +     ',
                mate: '       '
            },
            { //  
                name: '   ',
                badge: 'TYPE 02',
                img: './img/healing-type2.jpg',
                tags: ['#', '#', '#', '#'],
                summary: '      !     .',
                outer: "      ",
                inner: "        ",
                stats: { home: 80, emotion: 95, walk: 45, active: 40 },
                burnout: '        .',
                solution: '         ',
                mate: '        '
            },
            { //  
                name: '   ',
                badge: 'TYPE 03',
                img: './img/healing-type3.jpg',
                tags: ['#', '#', '#', '#'],
                summary: '      !       .',
                outer: "      ",
                inner: "         ",
                stats: { home: 40, emotion: 70, walk: 95, active: 80 },
                burnout: '         ',
                solution: '          ',
                mate: '  " ?"       '
            },
            { // 
                name: '   ',
                badge: 'TYPE 04',
                img: './img/healing-type4.jpg',
                tags: ['#', '#', '#', '#'],
                summary: '        !     !',
                outer: "      ",
                inner: "          ",
                stats: { home: 25, emotion: 60, walk: 85, active: 99 },
                burnout: '          ',
                solution: '          ',
                mate: '     200%   '
            }
        ];

        function finish() {
            getEl("progress-container").classList.add("hidden");
            getEl("screen-q").classList.add("hidden");
            getEl("screen-loading").classList.remove("hidden");
            getEl("screen-loading").classList.add("flex");

            var resIdx = 0;
            if (scoreA >= 10) resIdx = 0;
            else if (scoreA >= 7) resIdx = 1;
            else if (scoreA >= 4) resIdx = 2;
            else resIdx = 3;

            var r = RESULTS[resIdx];

            setTimeout(function() {
                getEl("screen-loading").classList.add("hidden");
                getEl("screen-loading").classList.remove("flex");
                getEl("screen-result").classList.remove("hidden");

                getEl("res-badge").innerText = r.badge;
                getEl("res-name").innerText = r.name;
                getEl("res-healing-img").src = r.img;
                getEl("res-healing-img").alt = r.name;
                getEl("res-summary").innerText = r.summary;
                getEl("res-outer").innerText = r.outer;
                getEl("res-inner").innerText = r.inner;

                if (r.stats) {
                    getEl("stat-home-val").innerText = r.stats.home + '%';
                    getEl("stat-home-bar").style.width = r.stats.home + '%';
                    getEl("stat-emotion-val").innerText = r.stats.emotion + '%';
                    getEl("stat-emotion-bar").style.width = r.stats.emotion + '%';
                    getEl("stat-walk-val").innerText = r.stats.walk + '%';
                    getEl("stat-walk-bar").style.width = r.stats.walk + '%';
                    getEl("stat-active-val").innerText = r.stats.active + '%';
                    getEl("stat-active-bar").style.width = r.stats.active + '%';
                }

                getEl("res-burnout").innerText = r.burnout;
                getEl("res-solution").innerText = r.solution;
                getEl("res-mate").innerText = r.mate;

                var tagsEl = getEl("res-tags");
                tagsEl.innerHTML = '';
                r.tags.forEach(t => {
                    var sp = document.createElement('span');
                    sp.className = 'bg-teal-50 px-2 py-0.5 rounded text-[11px] text-teal-700 font-bold';
                    sp.innerText = t;
                    tagsEl.appendChild(sp);
                });

                renderComments();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 1000);
        }

        //  /  (html2canvas)
        function downloadResultImage() {
            const captureEl = document.getElementById('capture-area');
            if (!captureEl) return;

            alert('    .  !');

            html2canvas(captureEl, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '___.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                alert('    .   !');
            });
        }

        function restartTest() {
            getEl("screen-result").classList.add("hidden");
            getEl("screen-start").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getStoredComments(key) {
            const stored = localStorage.getItem('test_comments_' + key);
            if (stored) {
                try { return JSON.parse(stored); } catch(e) {}
            }
            return [];
        }

        function renderComments() {
            const list = document.getElementById('comment-list');
            if (!list) return;
            const comments = getStoredComments('healing_test');
            list.innerHTML = '';

            if (comments.length === 0) {
                list.innerHTML = '<div class="p-6 text-center text-xs text-gray-400">   .<br>     !</div>';
                return;
            }

            comments.forEach((c, idx) => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-gray-50/70 rounded-xl border border-gray-100 space-y-1';
                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-800">${c.nick}</span>
                        <span class="text-[10px] text-gray-400">${c.time}</span>
                    </div>
                    <p class="text-xs text-gray-700 leading-snug break-keep">${c.text}</p>
                    <div class="flex justify-end pt-0.5">
                        <button onclick="likeComment('healing_test', ${idx})" class="text-[10px] text-gray-400 hover:text-teal-600 flex items-center space-x-1">
                            <span></span>
                            <span class="font-bold">${c.likes || 0}</span>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function submitComment() {
            const nickEl = document.getElementById('comment-nickname');
            const textEl = document.getElementById('comment-text');

            const nick = nickEl.value.trim() || '';
            const text = textEl.value.trim();

            if (!text) { alert('  !'); return; }

            const comments = getStoredComments('healing_test');
            comments.unshift({
                nick: nick,
                time: ' ',
                text: text,
                likes: 0
            });

            localStorage.setItem('test_comments_healing_test', JSON.stringify(comments));
            textEl.value = '';
            renderComments();
            alert('  !');
        }

        function likeComment(key, idx) {
            const comments = getStoredComments(key);
            if (comments[idx]) {
                comments[idx].likes = (comments[idx].likes || 0) + 1;
                localStorage.setItem('test_comments_' + key, JSON.stringify(comments));
                renderComments();
            }
        }

        function shareResult() {
            const url = window.location.href;
            const title = '     ';
            const text = '     !    !';

            if (navigator.share) {
                navigator.share({ title: title, text: text, url: url }).catch(() => {});
            } else {
                const dummy = document.createElement('textarea');
                document.body.appendChild(dummy);
                dummy.value = `${text}\n${url}`;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                alert('  !   DM  .');
            }
        }
    </script>
</body>
</html>
