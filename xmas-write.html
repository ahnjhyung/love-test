<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-WRDDWJ26"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GT-WRDDWJ26');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>크리스마스 편지 쓰기 | 테스트모음</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&family=Gowun+Dodum&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .radio-card:checked + div { border-color: #ef4444; background-color: rgba(239, 68, 68, 0.1); }
    </style>
</head>
<body class="min-h-screen flex justify-center bg-slate-900">
    <div class="w-full max-w-[480px] bg-slate-800 min-h-screen flex flex-col shadow-xl relative pb-16 px-5 pt-8">
        
        <div class="text-center mb-6">
            <h1 class="text-xl font-black text-white mb-2">
                <span id="display-owner" class="text-red-400">---</span>님의 트리에<br>편지를 달아주세요!
            </h1>
            <p class="text-xs text-slate-400 font-['Gowun_Dodum']">작성하신 편지는 12월 25일에만 열어볼 수 있어요.</p>
        </div>

        <form id="write-form" class="space-y-6 flex-1">
            
            <!-- 오너먼트 선택 -->
            <div class="space-y-3">
                <label class="block text-sm font-bold text-slate-300">장식(오너먼트) 선택</label>
                <div class="grid grid-cols-4 gap-2">
                    <!-- 별 -->
                    <label class="relative cursor-pointer">
                        <input type="radio" name="ornamentType" value="star" class="peer sr-only radio-card" checked>
                        <div class="border-2 border-slate-600 bg-slate-700 rounded-xl py-3 flex justify-center items-center transition-all peer-checked:border-red-500">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#fbbf24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                        </div>
                    </label>
                    <!-- 방울 -->
                    <label class="relative cursor-pointer">
                        <input type="radio" name="ornamentType" value="bauble" class="peer sr-only radio-card">
                        <div class="border-2 border-slate-600 bg-slate-700 rounded-xl py-3 flex justify-center items-center transition-all peer-checked:border-red-500">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#ef4444"><circle cx="12" cy="13" r="8"/><rect x="10" y="3" width="4" height="3" fill="#94a3b8"/></svg>
                        </div>
                    </label>
                    <!-- 지팡이사탕 -->
                    <label class="relative cursor-pointer">
                        <input type="radio" name="ornamentType" value="candy" class="peer sr-only radio-card">
                        <div class="border-2 border-slate-600 bg-slate-700 rounded-xl py-3 flex justify-center items-center transition-all peer-checked:border-red-500">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="4" stroke-linecap="round"><path d="M16 10V18 M16 10C16 6 10 6 10 10V20"/></svg>
                        </div>
                    </label>
                    <!-- 선물상자 -->
                    <label class="relative cursor-pointer">
                        <input type="radio" name="ornamentType" value="gift" class="peer sr-only radio-card">
                        <div class="border-2 border-slate-600 bg-slate-700 rounded-xl py-3 flex justify-center items-center transition-all peer-checked:border-red-500">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#60a5fa"><rect x="4" y="9" width="16" height="12" rx="1"/><rect x="3" y="6" width="18" height="3" rx="0.5"/><path d="M12 6V21" stroke="#3b82f6" stroke-width="2"/><path d="M12 6H9C7 6 7 3 9 3C11 3 12 6 12 6Z" fill="#3b82f6"/><path d="M12 6H15C17 6 17 3 15 3C13 3 12 6 12 6Z" fill="#3b82f6"/></svg>
                        </div>
                    </label>
                </div>
            </div>

            <!-- 보내는 사람 -->
            <div class="space-y-2">
                <label for="authorName" class="block text-sm font-bold text-slate-300">보내는 사람 (익명 가능)</label>
                <input type="text" id="authorName" required maxlength="10" placeholder="예: 산타할아버지" 
                    class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500">
            </div>

            <!-- 편지 내용 -->
            <div class="space-y-2">
                <label for="content" class="block text-sm font-bold text-slate-300">따뜻한 편지 한마디</label>
                <textarea id="content" required rows="4" maxlength="200" placeholder="메리 크리스마스! 올 한 해 고생 많았어 :)" 
                    class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 resize-none font-['Gowun_Dodum'] text-sm leading-relaxed"></textarea>
                <div class="text-right text-xs text-slate-500">최대 200자</div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold text-lg py-4 rounded-xl mt-4 transition-colors shadow-[0_4px_14px_0_rgba(239,68,68,0.39)]">
                트리에 편지 달기
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://fcuenflxkkpyplehsizg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjdWVuZmx4a2tweXBsZWhzaXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MTU5NjgsImV4cCI6MjA4NTA5MTk2OH0.xfAV9dpBkhh-5FgV0uwCw8DO3EGqFNeoQrENldaqa8c';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const treeId = urlParams.get('id');
        let ownerName = '';

        if (!treeId) {
            alert('잘못된 접근입니다.');
            window.location.href = '/';
        }

        // 트리 방 정보 로드
        async function loadTreeInfo() {
            const { data, error } = await supabase.from('xmas_trees').select('owner_name').eq('id', treeId).single();
            if (error || !data) {
                alert('삭제되었거나 존재하지 않는 트리입니다.');
                window.location.href = '/';
                return;
            }
            ownerName = data.owner_name;
            document.getElementById('display-owner').textContent = ownerName;
        }

        loadTreeInfo();

        const form = document.getElementById('write-form');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const author = document.getElementById('authorName').value.trim();
            const text = document.getElementById('content').value.trim();
            const ornamentType = document.querySelector('input[name="ornamentType"]:checked').value;

            if (!author || !text) return alert('모두 입력해주세요.');

            // 트리에 달릴 랜덤 위치 계산 (x: 20~80%, y: 20~85%) - 트리 형상 내부에 대략적으로 위치하도록 제한
            const posX = 20 + Math.random() * 60;
            const posY = 20 + Math.random() * 65;

            submitBtn.disabled = true;
            submitBtn.textContent = '장식 다는 중...';

            try {
                const { error } = await supabase.from('xmas_messages').insert([{
                    tree_id: treeId,
                    author_name: author,
                    content: text,
                    ornament_type: ornamentType,
                    ornament_color: 'default', // 확장성 고려
                    position_x: posX,
                    position_y: posY
                }]);

                if (error) throw error;
                
                alert('트리에 장식이 예쁘게 달렸습니다!');
                window.location.href = `/xmas-view.html?id=${treeId}`;
                
            } catch (err) {
                console.error(err);
                alert('오류가 발생했습니다. 다시 시도해주세요.');
                submitBtn.disabled = false;
                submitBtn.textContent = '트리에 편지 달기';
            }
        });
    </script>
</body>
</html>
