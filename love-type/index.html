<body class="min-h-screen flex justify-center">

    <!-- 모바일 컨테이너 (max-w-[480px]) -->
    <div class="w-full max-w-[480px] bg-white min-h-screen flex flex-col shadow-sm relative">
        
        <!-- 상단 헤더 -->
        <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-sm font-semibold text-gray-500 hover:text-gray-900 flex items-center space-x-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span>테스트모음</span>
            </a>
            <span class="text-xs font-bold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-full">연애·심리</span>
        </header>

        <!-- 프로그레스 바 -->
        <div id="progress-container" class="hidden w-full h-1 bg-gray-100 flex-none">
            <div id="progress-bar" class="h-full bg-rose-500 transition-all duration-300 ease-out" style="width: 0%"></div>
        </div>

        <main class="flex-1 p-5 flex flex-col justify-between">
            
            <!-- 1. 시작 화면 -->
            <div id="screen-start" class="flex-1 flex flex-col justify-between py-2 text-center fade-in">
                <div class="space-y-4">
                    <!-- 썸네일 일러스트 -->
                    <div class="w-full aspect-[4/3] rounded-2xl overflow-hidden shadow-sm border border-rose-50 bg-rose-50/30 relative">
                        <img src="../img/thumb-love.jpg" alt="연애 유형 테스트" class="w-full h-full object-cover">
                    </div>

                    <div class="pt-2 space-y-1.5">
                        <span class="badge-tag bg-rose-50 text-rose-600">8가지 연애 DNA 분석</span>
                        <h1 class="text-2xl font-black text-gray-900 leading-tight">
                            나의 연애 유형은?<br>연애 성향 심리테스트
                        </h1>
                        <p class="text-xs text-gray-500 leading-relaxed pt-1">
                            MBTI와 애착 유형 이론 기반 20문항으로 알아보는<br>내 무의식 속 연애 스타일과 환상의 짝꿍
                        </p>
                    </div>
                </div>

                <div class="pt-6 pb-2 space-y-3">
                    <input type="text" id="input-name" placeholder="이름 또는 닉네임을 입력하세요" 
                        onkeydown="checkEnter(event)"
                        class="w-full px-4 py-3.5 rounded-xl border border-gray-200 focus:border-rose-500 focus:ring-1 focus:ring-rose-500 text-center text-sm bg-white transition-colors">
                    
                    <button onclick="startTest()" class="w-full py-4 bg-rose-500 active:scale-[0.98] text-white rounded-xl font-bold text-base shadow-lg shadow-rose-200 hover:bg-rose-600 transition-all cursor-pointer">
                        테스트 시작하기
                    </button>
                    
                    <p class="text-[11px] text-gray-400 text-center">
                        총 20문항 · 소요 시간 약 2분 · 100% 무료
                    </p>
                </div>
            </div>

            <!-- 2. 질문 화면 -->
            <div id="screen-q" class="hidden flex-1 flex-col justify-between py-2 fade-in">
                <div class="space-y-6 pt-4">
                    <div class="space-y-2 text-center">
                        <span id="txt-q-num" class="badge-tag bg-rose-50 text-rose-600">Q. 01 / 20</span>
                        <h2 id="txt-q" class="text-lg font-bold text-gray-900 leading-snug break-keep pt-2">질문 내용</h2>
                    </div>
                    
                    <div class="space-y-3 w-full pt-4">
                        <button onclick="next('A')" class="w-full p-4 text-left bg-white border border-gray-200 rounded-2xl active:scale-[0.98] hover:border-rose-400 hover:bg-rose-50/40 transition-all shadow-xs group">
                            <span class="block text-[11px] text-rose-500 font-bold mb-1">A</span>
                            <span id="txt-a" class="text-sm font-medium text-gray-800 block leading-relaxed break-keep">답변 A</span>
                        </button>
                        <button onclick="next('B')" class="w-full p-4 text-left bg-white border border-gray-200 rounded-2xl active:scale-[0.98] hover:border-rose-400 hover:bg-rose-50/40 transition-all shadow-xs group">
                            <span class="block text-[11px] text-rose-500 font-bold mb-1">B</span>
                            <span id="txt-b" class="text-sm font-medium text-gray-800 block leading-relaxed break-keep">답변 B</span>
                        </button>
                    </div>
                </div>

                <!-- 애드센스 인피드 광고 -->
                <div class="rounded-xl overflow-hidden bg-gray-50 border border-gray-100 text-center my-4">
                    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8530559977181821" crossorigin="anonymous"></script>
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-8530559977181821"
                         data-ad-slot="1234567890"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                </div>
            </div>

            <!-- 3. 로딩 화면 -->
            <div id="screen-loading" class="hidden flex-1 flex-col items-center justify-center py-20 space-y-4 text-center">
                <div class="loader"></div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-800 text-base">연애 성향 분석 중...</h3>
                    <p class="text-xs text-gray-400">당신의 연애 DNA 유형을 계산하고 있습니다</p>
                </div>
            </div>

        </main>

        <footer class="border-t border-gray-100 bg-white px-4 py-4 text-center text-xs text-gray-400">
            <p>© 2026 테스트모음. All rights reserved.</p>
        </footer>

    </div>

    <script>
        var questions = [
            { q: "주말 데이트, 선호하는 방식은?", a: "동선과 맛집 예약까지 완벽하게 계획된 데이트", b: "그날의 날씨와 기분에 따라 발길 닿는 대로" },
            { q: "연인과 다퉜을 때 나는?", a: "논리적으로 잘잘못을 따져 해결책을 찾는다", b: "일단 서로의 상한 기분부터 풀어준다" },
            { q: "기념일 선물, 무엇이 더 좋을까?", a: "평소 갖고 싶었던 실용적인 전자기기나 물건", b: "정성이 담긴 손편지와 낭만적인 꽃다발" },
            { q: "힘든 하루를 보낸 연인에게?", a: "\"무슨 일 있었어?\" 상황을 듣고 해결책 제시", b: "\"오늘 정말 고생 많았어\" 따뜻한 위로와 공감" },
            { q: "여행 짐을 쌀 때 나는?", a: "체크리스트를 만들어 꼼꼼하게 챙긴다", b: "필요한 건 가서 사면 되지! 중요 물품만 챙긴다" },
            { q: "식당 메뉴를 고를 때 나는?", a: "별점과 후기를 분석해서 실패를 줄인다", b: "메뉴판 사진이나 직관적인 느낌으로 고른다" },
            { q: "갑자기 생긴 여유 시간?", a: "미뤄뒀던 할 일을 처리하거나 생산적으로 보낸다", b: "침대에서 뒹굴거리거나 멍하니 휴식한다" },
            { q: "대화 중 침묵이 흐를 때?", a: "어색함을 없애려 새로운 대화 주제를 꺼낸다", b: "침묵 또한 편안한 분위기로 즐긴다" },
            { q: "약속 시간에 연인이 늦는다면?", a: "\"지금 어디야? 몇 분 도착이야?\" 정확히 묻는다", b: "\"천천히 조심히 와~\" 하고 느긋하게 기다린다" },
            { q: "영화를 선택하는 기준은?", a: "스토리 개연성과 평론가 평점", b: "영상미, 음악, 배우의 연기, 분위기" },
            { q: "미래에 대해 이야기할 때?", a: "저축, 주거 계획 등 현실적인 이야기", b: "우리가 함께 할 행복한 순간들과 꿈같은 이야기" },
            { q: "연인이 새 옷을 입었을 때?", a: "\"오, 재질 좋네. 얼마 줬어?\"", b: "\"우와! 오늘 분위기 너무 좋다. 정말 예쁘다!\"" },
            { q: "더블 데이트 제안?", a: "둘만의 오붓한 시간이 더 좋다 (내향적)", b: "여럿이 함께 노는 게 더 신난다 (외향적)" },
            { q: "고민이 생겼을 때?", a: "혼자 깊이 생각하고 결론을 내린 뒤 말한다", b: "일단 연인에게 털어놓고 함께 이야기한다" },
            { q: "나의 사랑 표현 방식은?", a: "상대방을 챙겨주는 행동과 실질적 배려", b: "사랑한다는 따뜻한 말과 스킨십" },
            { q: "함께 살 집을 고를 때?", a: "역세권, 투자가치, 인프라를 분석한다", b: "채광, 인테리어 분위기, 뷰를 중요시한다" },
            { q: "로또 1등에 당첨된다면?", a: "저축, 투자, 대출 상환 계획부터 세운다", b: "세계 일주나 멋진 차를 사는 상상을 먼저 한다" },
            { q: "연인에게 서운한 점이 있다면?", a: "이유와 상황을 논리적으로 설명한다", b: "나의 감정이 어땠는지 표정이나 말투로 표현한다" },
            { q: "데이트 중 길을 잃었다면?", a: "지도 앱을 켜고 최단 경로를 검색한다", b: "이것도 추억이지! 주변 풍경을 구경하며 걷는다" },
            { q: "연인이 엉뚱한 상상을 말할 때?", a: "\"그게 물리적으로 가능해?\" 현실적인 답변", b: "\"대박! 그럼 우리 우주로 가는 거야?\" 맞장구" }
        ];

        var currentStep = 0;
        var score = 0;

        function getEl(id) { return document.getElementById(id); }
        function checkEnter(e) { if (e.key === "Enter") startTest(); }

        function startTest() {
            var name = getEl("input-name").value.trim();
            if (!name) { alert("이름 또는 닉네임을 입력해주세요!"); return; }
            currentStep = 0; score = 0;
            getEl("screen-start").classList.add("hidden");
            getEl("progress-container").classList.remove("hidden");
            getEl("screen-q").classList.remove("hidden");
            getEl("screen-q").classList.add("flex");
            renderQuestion();
        }

        function renderQuestion() {
            var q = questions[currentStep];
            var progress = ((currentStep + 1) / questions.length) * 100;
            getEl("progress-bar").style.width = progress + "%";
            getEl("txt-q-num").innerText = "Q. " + (currentStep + 1) + " / " + questions.length;
            getEl("txt-q").innerText = q.q;
            getEl("txt-a").innerText = q.a;
            getEl("txt-b").innerText = q.b;
        }

        function next(type) {
            if (type === 'B') score++;
            currentStep++;
            if (currentStep < questions.length) { 
                setTimeout(renderQuestion, 150); 
            } else { 
                finish(); 
            }
        }

        function finish() {
            getEl("screen-q").classList.add("hidden");
            getEl("screen-q").classList.remove("flex");
            getEl("progress-container").classList.add("hidden");
            getEl("screen-loading").classList.remove("hidden");
            getEl("screen-loading").classList.add("flex");

            var typeKey = "Type4";
            if (score <= 2) typeKey = "Type1";      
            else if (score <= 5) typeKey = "Type2"; 
            else if (score <= 8) typeKey = "Type3"; 
            else if (score <= 10) typeKey = "Type4";
            else if (score <= 12) typeKey = "Type5";
            else if (score <= 15) typeKey = "Type6";
            else if (score <= 18) typeKey = "Type7";
            else typeKey = "Type8";                  

            setTimeout(function() { 
                window.location.href = './' + typeKey + '.html'; 
            }, 1200); 
        }
    </script>
</body>
