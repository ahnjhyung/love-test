        let currentQuestion = 0;

        function startTest() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
            document.getElementById('screen-question').classList.remove('hidden');
            currentQuestion = 0;
            userScores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            renderQuestion();
        }

        function renderQuestion() {
            const q = QUESTIONS[currentQuestion];
            const progress = ((currentQuestion + 1) / QUESTIONS.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('question-number').textContent = `Q${currentQuestion + 1} / ${QUESTIONS.length}`;
            document.getElementById('question-category').textContent = q.cat;
            document.getElementById('question-text').textContent = q.q;

            const answersContainer = document.getElementById('answers-container');
            answersContainer.innerHTML = '';

            q.a.forEach((ans, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full p-4 text-left text-xs font-semibold text-gray-700 bg-gray-50/80 hover:bg-rose-50/60 hover:text-rose-700 hover:border-rose-300 rounded-2xl border border-gray-200/80 active:scale-[0.99] transition-all flex items-center justify-between group';
                btn.innerHTML = `
                    <span class="leading-relaxed break-keep pr-2">${ans.text}</span>
                    <span class="w-5 h-5 rounded-full border border-gray-300 group-hover:border-rose-500 group-hover:bg-rose-500 flex items-center justify-center text-white text-[10px] flex-none">→</span>
                `;
                btn.onclick = () => selectAnswer(ans.scores);
                answersContainer.appendChild(btn);
            });
        }

        function selectAnswer(scores) {
            for (let key in scores) {
                userScores[key] += scores[key];
            }

            currentQuestion++;
            if (currentQuestion < QUESTIONS.length) {
                renderQuestion();
            } else {
                showLoading();
            }
        }

        function showLoading() {
            document.getElementById('screen-question').classList.add('hidden');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('screen-loading').classList.remove('hidden');
            document.getElementById('screen-loading').classList.add('flex');

            setTimeout(() => {
                calculateAndShowResult();
            }, 1200);
        }

        function calculateAndShowResult() {
            document.getElementById('screen-loading').classList.add('hidden');
            document.getElementById('screen-loading').classList.remove('flex');
            document.getElementById('screen-result').classList.remove('hidden');

            const isE = userScores.E >= userScores.I;
            const isI = !isE;
            const isS = userScores.S >= userScores.N;
            const isN = !isS;
            const isT = userScores.T >= userScores.F;
            const isF = !isT;
            const isJ = userScores.J >= userScores.P;
            const isP = !isJ;

            // MBTI  8   
            let typeIdx = 0;
            if (isT && isJ) typeIdx = 0; //    
            else if (isF && isP && isE) typeIdx = 1; //    
            else if (isF && isJ) typeIdx = 2; //   
            else if (isT && isP && isE) typeIdx = 3; //    
            else if (isT && isP && isI) typeIdx = 4; //   
            else if (isE && isP) typeIdx = 5; //   
            else if (isS && isJ) typeIdx = 6; //   
            else typeIdx = 7; //    

            const typeData = LOVE_TYPES[typeIdx];

            document.getElementById('result-type-badge').textContent = typeData.badge;
            document.getElementById('result-title').textContent = typeData.name;
            document.getElementById('result-tags').innerHTML = typeData.tags.map(t => `<span class="bg-rose-50 px-2 py-0.5 rounded-md">${t}</span>`).join('');
            document.getElementById('result-love-img').src = typeData.img || '../img/love-type1.jpg';
            document.getElementById('result-love-img').alt = typeData.name;
            document.getElementById('result-summary').textContent = typeData.summary;
            document.getElementById('result-detail').textContent = typeData.detail;

            document.getElementById('result-outer').textContent = typeData.outer;
            document.getElementById('result-inner').textContent = typeData.inner;

            //   
            if (typeData.stats) {
                document.getElementById('stat-express-val').textContent = typeData.stats.express + '%';
                document.getElementById('stat-express-bar').style.width = typeData.stats.express + '%';
                document.getElementById('stat-contact-val').textContent = typeData.stats.contact + '%';
                document.getElementById('stat-contact-bar').style.width = typeData.stats.contact + '%';
                document.getElementById('stat-heal-val').textContent = typeData.stats.heal + '%';
                document.getElementById('stat-heal-bar').style.width = typeData.stats.heal + '%';
                document.getElementById('stat-jealous-val').textContent = typeData.stats.jealous + '%';
                document.getElementById('stat-jealous-bar').style.width = typeData.stats.jealous + '%';
            }

            const featuresContainer = document.getElementById('result-features');
            featuresContainer.innerHTML = typeData.features.map(f => `
                <div class="flex items-start space-x-2">
                    <span class="text-rose-500 font-bold">•</span>
                    <span>${f}</span>
                </div>
            `).join('');

            document.getElementById('result-love').textContent = typeData.love;
            document.getElementById('result-manual').textContent = typeData.manual;

            document.getElementById('result-trigger').textContent = typeData.trigger;
            document.getElementById('result-recharge').textContent = typeData.recharge;

            document.getElementById('result-best-match').textContent = typeData.bestMatch;
            document.getElementById('result-best-desc').textContent = typeData.bestDesc;
            document.getElementById('result-bad-match').textContent = typeData.badMatch;
            document.getElementById('result-bad-desc').textContent = typeData.badDesc;

            renderComments();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function downloadResultImage() {
            const captureEl = document.getElementById('capture-area');
            if (!captureEl) return;

            alert('    .  !');

            html2canvas(captureEl, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '___.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                alert('    .   !');
            });
        }

        function getStoredComments(key) {
            const stored = localStorage.getItem('test_comments_' + key);
            if (stored) {
                try { return JSON.parse(stored); } catch(e) {}
            }
            return [];
        }

        function renderComments() {
            const list = document.getElementById('comment-list');
            if (!list) return;
            const comments = getStoredComments('love_type');
            list.innerHTML = '';

            if (comments.length === 0) {
                list.innerHTML = '<div class="p-6 text-center text-xs text-gray-400">   .<br>      !</div>';
                return;
            }

            comments.forEach((c, idx) => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-gray-50/70 rounded-xl border border-gray-100 space-y-1';
                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-800">${c.nick}</span>
                        <span class="text-[10px] text-gray-400">${c.time}</span>
                    </div>
                    <p class="text-xs text-gray-700 leading-snug break-keep">${c.text}</p>
                    <div class="flex justify-end pt-0.5">
                        <button onclick="likeComment('love_type', ${idx})" class="text-[10px] text-gray-400 hover:text-rose-600 flex items-center space-x-1">
                            <span></span>
                            <span class="font-bold">${c.likes || 0}</span>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function submitComment() {
            const nickEl = document.getElementById('comment-nickname');
            const textEl = document.getElementById('comment-text');

            const nick = nickEl.value.trim() || '';
            const text = textEl.value.trim();

            if (!text) { alert('  !'); return; }

            const comments = getStoredComments('love_type');
            comments.unshift({
                nick: nick,
                time: ' ',
                text: text,
                likes: 0
            });

            localStorage.setItem('test_comments_love_type', JSON.stringify(comments));
            textEl.value = '';
            renderComments();
            alert('  !');
        }

        function likeComment(key, idx) {
            const comments = getStoredComments(key);
            if (comments[idx]) {
                comments[idx].likes = (comments[idx].likes || 0) + 1;
                localStorage.setItem('test_comments_' + key, JSON.stringify(comments));
                renderComments();
            }
        }

        function shareResult() {
            const url = window.location.href;
            const title = '    ';
            const text = '     !    !';

            if (navigator.share) {
                navigator.share({ title: title, text: text, url: url }).catch(() => {});
            } else {
                const dummy = document.createElement('textarea');
                document.body.appendChild(dummy);
                dummy.value = `${text}\n${url}`;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                alert('  !   DM  .');
            }
        }
