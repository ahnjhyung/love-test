        let currentResult = null;

        function calculateSajuLife() {
            const name = document.getElementById('user-name').value.trim() || '';
            const year = parseInt(document.getElementById('birth-year').value);
            const month = parseInt(document.getElementById('birth-month').value);
            const day = parseInt(document.getElementById('birth-day').value);
            const timeVal = document.getElementById('birth-time').value;

            showScreen('loading-screen');

            setTimeout(() => {
                const jdn = calcJDN(year, month, day);
                
                // 1. 
                const dayGan = (jdn + 9) % 10;
                const dayJi = (jdn + 1) % 12;

                // 2. 
                let yearGan = (year - 4) % 10;
                if (yearGan < 0) yearGan += 10;
                let yearJi = (year - 4) % 12;
                if (yearJi < 0) yearJi += 12;

                // 3. 
                const monthJi = (month + 1) % 12;
                const monthGan = ((yearGan % 5) * 2 + (month - 1) + 2) % 10;

                // 4. 
                let hourJi = 6;
                let hourGan = ((dayGan % 5) * 2 + hourJi) % 10;
                let hasTime = (timeVal !== '');
                if (hasTime && TIME_JIJI_MAP[timeVal] !== undefined) {
                    hourJi = TIME_JIJI_MAP[timeVal];
                    hourGan = ((dayGan % 5) * 2 + hourJi) % 10;
                }

                // 8   
                const ohaengCounts = [0, 0, 0, 0, 0];
                ohaengCounts[CHEONGAN_OHAENG[yearGan]]++;
                ohaengCounts[JIJI_OHAENG[yearJi]]++;
                ohaengCounts[CHEONGAN_OHAENG[monthGan]]++;
                ohaengCounts[JIJI_OHAENG[monthJi]]++;
                ohaengCounts[CHEONGAN_OHAENG[dayGan]]++;
                ohaengCounts[JIJI_OHAENG[dayJi]]++;

                if (hasTime) {
                    ohaengCounts[CHEONGAN_OHAENG[hourGan]]++;
                    ohaengCounts[JIJI_OHAENG[hourJi]]++;
                } else {
                    ohaengCounts[CHEONGAN_OHAENG[dayGan]]++;
                    ohaengCounts[JIJI_OHAENG[dayJi]]++;
                }

                // UI 
                document.getElementById('cnt-wood').textContent = ohaengCounts[0] + '';
                document.getElementById('cnt-fire').textContent = ohaengCounts[1] + '';
                document.getElementById('cnt-earth').textContent = ohaengCounts[2] + '';
                document.getElementById('cnt-metal').textContent = ohaengCounts[3] + '';
                document.getElementById('cnt-water').textContent = ohaengCounts[4] + '';

                //   
                const tCheongan = document.getElementById('table-cheongan');
                tCheongan.innerHTML = '';
                const cheonganCols = hasTime ? [hourGan, dayGan, monthGan, yearGan] : [dayGan, dayGan, monthGan, yearGan];
                cheonganCols.forEach(idx => {
                    const oh = CHEONGAN_OHAENG[idx];
                    const div = document.createElement('div');
                    div.className = `p-2 rounded-lg border text-sm font-black ${OHAENG_CLASSES[oh]}`;
                    div.textContent = `${CHEONGAN_HANJA[idx]}`;
                    tCheongan.appendChild(div);
                });

                const tJiji = document.getElementById('table-jiji');
                tJiji.innerHTML = '';
                const jijiCols = hasTime ? [hourJi, dayJi, monthJi, yearJi] : [dayJi, dayJi, monthJi, yearJi];
                jijiCols.forEach(idx => {
                    const oh = JIJI_OHAENG[idx];
                    const div = document.createElement('div');
                    div.className = `p-2 rounded-lg border text-sm font-black ${OHAENG_CLASSES[oh]}`;
                    div.textContent = `${JIJI_HANJA[idx]}`;
                    tJiji.appendChild(div);
                });

                //   
                let maxVal = -1;
                let maxOh = 0;
                let minOhList = [];

                for (let i = 0; i < 5; i++) {
                    if (ohaengCounts[i] > maxVal) { maxVal = ohaengCounts[i]; maxOh = i; }
                    if (ohaengCounts[i] === 0) { minOhList.push(OHAENG_LABELS[i]); }
                }

                const balTitle = document.getElementById('res-balance-title');
                const balDesc = document.getElementById('res-balance-desc');
                balTitle.textContent = `${OHAENG_LABELS[maxOh]}  ${maxVal}    !`;
                
                let descText = `  ${OHAENG_LABELS[maxOh]}    . `;
                if (minOhList.length > 0) {
                    descText += ` ${minOhList.join(', ')}  ,            .`;
                } else {
                    descText += `5           .`;
                }
                balDesc.textContent = descText;

                //   
                const charData = CHARACTERS_LIFE[dayGan];
                currentResult = { name, charData };

                document.getElementById('res-user-name').textContent = name;
                document.getElementById('res-element-img').src = charData.elementImg;
                document.getElementById('res-ilgan-badge').textContent = CHEONGAN_NAME[dayGan];
                document.getElementById('res-char-name').textContent = charData.name;
                document.getElementById('res-element-title').textContent = charData.elementTitle;
                document.getElementById('res-summary').textContent = charData.summary;

                const tagsEl = document.getElementById('res-tags');
                tagsEl.innerHTML = '';
                charData.tags.forEach(t => {
                    const sp = document.createElement('span');
                    sp.className = 'bg-white border border-indigo-100 px-2 py-0.5 rounded text-[11px] text-indigo-700 shadow-2xs';
                    sp.textContent = t;
                    tagsEl.appendChild(sp);
                });

                // 4  
                document.getElementById('res-wealth-grade').textContent = charData.wealthGrade;
                document.getElementById('res-wealth-desc').textContent = charData.wealthDesc;
                document.getElementById('res-career-desc').textContent = charData.careerDesc;
                document.getElementById('res-people-desc').textContent = charData.peopleDesc;
                document.getElementById('res-lucky-color').textContent = charData.luckyColor;
                document.getElementById('res-health-desc').textContent = charData.healthDesc;

                renderComments();
                showScreen('result-screen');
            }, 1000);
        }

        function getStoredComments(key) {
            const stored = localStorage.getItem('test_comments_' + key);
            if (stored) {
                try { return JSON.parse(stored); } catch(e) {}
            }
            return [];
        }

        function renderComments() {
            const list = document.getElementById('comment-list');
            if (!list) return;
            const comments = getStoredComments('saju_life');
            list.innerHTML = '';

            if (comments.length === 0) {
                list.innerHTML = '<div class="p-6 text-center text-xs text-gray-400">   .<br>    !</div>';
                return;
            }

            comments.forEach((c, idx) => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-gray-50/70 rounded-xl border border-gray-100 space-y-1';
                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-800">${c.nick}</span>
                        <span class="text-[10px] text-gray-400">${c.time}</span>
                    </div>
                    <p class="text-xs text-gray-700 leading-snug break-keep">${c.text}</p>
                    <div class="flex justify-end pt-0.5">
                        <button onclick="likeComment('saju_life', ${idx})" class="text-[10px] text-gray-400 hover:text-indigo-600 flex items-center space-x-1">
                            <span></span>
                            <span class="font-bold">${c.likes || 0}</span>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function submitComment() {
            const nickEl = document.getElementById('comment-nickname');
            const textEl = document.getElementById('comment-text');

            const nick = nickEl.value.trim() || '';
            const text = textEl.value.trim();

            if (!text) { alert('  !'); return; }

            const comments = getStoredComments('saju_life');
            comments.unshift({
                nick: nick,
                time: ' ',
                text: text,
                likes: 0
            });

            localStorage.setItem('test_comments_saju_life', JSON.stringify(comments));
            textEl.value = '';
            renderComments();
            alert('  !');
        }

        function likeComment(key, idx) {
            const comments = getStoredComments(key);
            if (comments[idx]) {
                comments[idx].likes = (comments[idx].likes || 0) + 1;
                localStorage.setItem('test_comments_' + key, JSON.stringify(comments));
                renderComments();
            }
        }

        function shareResult() {
            const url = window.location.href;
            const title = currentResult ? `${currentResult.name}    ` : '    ';
            const text = currentResult ? `   [${currentResult.charData.name}]!    !` : '     !';

            if (navigator.share) {
                navigator.share({ title: title, text: text, url: url }).catch(() => {});
            } else {
                const dummy = document.createElement('textarea');
                document.body.appendChild(dummy);
                dummy.value = `${text}\n${url}`;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                alert('  !   DM  .');
            }
        }
