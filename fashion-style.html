        function startTest() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
            document.getElementById('screen-question').classList.remove('hidden');
            currentQuestion = 0;
            scores = { natural: 0, feminine: 0, classic: 0, street: 0, vintage: 0, formal: 0, sporty: 0, artistic: 0 };
            renderQuestion();
        }

        function renderQuestion() {
            const q = QUESTIONS[currentQuestion];
            const progress = ((currentQuestion + 1) / QUESTIONS.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('question-number').textContent = `Q${currentQuestion + 1} / ${QUESTIONS.length}`;
            document.getElementById('question-category').textContent = q.cat;
            document.getElementById('question-text').textContent = q.q;

            const answersContainer = document.getElementById('answers-container');
            answersContainer.innerHTML = '';

            q.a.forEach((ans, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full p-4 text-left text-xs font-semibold text-gray-700 bg-gray-50/80 hover:bg-pink-50/60 hover:text-pink-700 hover:border-pink-300 rounded-2xl border border-gray-200/80 active:scale-[0.99] transition-all flex items-center justify-between group';
                btn.innerHTML = `
                    <span class="leading-relaxed break-keep pr-2">${ans.text}</span>
                    <span class="w-5 h-5 rounded-full border border-gray-300 group-hover:border-pink-600 group-hover:bg-pink-600 flex items-center justify-center text-white text-[10px] flex-none">→</span>
                `;
                btn.onclick = () => selectAnswer(ans.scores);
                answersContainer.appendChild(btn);
            });
        }

        function selectAnswer(ansScores) {
            for (let key in ansScores) {
                if (scores[key] !== undefined) scores[key] += ansScores[key];
            }

            currentQuestion++;
            if (currentQuestion < QUESTIONS.length) {
                renderQuestion();
            } else {
                showLoading();
            }
        }

            }, 1200);
        }

            let highestKey = 'natural';
            let maxScore = -1;
            for (let key in scores) {
                if (scores[key] > maxScore) {
                    maxScore = scores[key];
                    highestKey = key;
                }
            }

            const keyToIndex = { natural: 0, feminine: 1, classic: 2, street: 3, vintage: 4, formal: 5, sporty: 6, artistic: 7 };
            const typeIdx = keyToIndex[highestKey] !== undefined ? keyToIndex[highestKey] : 0;
            const typeData = FASHION_TYPES[typeIdx];

            document.getElementById('result-type-badge').textContent = typeData.badge;
            document.getElementById('result-title').textContent = typeData.name;
            document.getElementById('result-tags').innerHTML = typeData.tags.map(t => `<span class="bg-pink-50 px-2 py-0.5 rounded-md">${t}</span>`).join('');
            document.getElementById('result-look-img').src = typeData.img || './img/look-natural.jpg';
            document.getElementById('result-look-img').alt = typeData.name;
            document.getElementById('result-summary').textContent = typeData.summary;

            const itemsContainer = document.getElementById('result-fashion-items');
            itemsContainer.innerHTML = typeData.items.map(it => `
                <div class="flex items-start space-x-2">
                    <span class="text-pink-600 font-bold">•</span>
                    <span>${it}</span>
                </div>
            `).join('');

            document.getElementById('result-hair').textContent = typeData.hair;
            document.getElementById('result-makeup').textContent = typeData.makeup;
            document.getElementById('result-color').textContent = typeData.color;
            document.getElementById('result-worst').textContent = typeData.worst;

            renderComments();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        //  /  (html2canvas)
        function downloadResultImage() {
            const captureEl = document.getElementById('capture-area');
            if (!captureEl) return;

            alert('    .  !');

            html2canvas(captureEl, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '___.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                alert('    .   !');
            });
        }

        function restartTest() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-start').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        //    (   )
        function getStoredComments(key) {
            const stored = localStorage.getItem('test_comments_' + key);
            if (stored) {
                try { return JSON.parse(stored); } catch(e) {}
            }
            return [];
        }

        function renderComments() {
            const list = document.getElementById('comment-list');
            if (!list) return;
            const comments = getStoredComments('fashion_style');
            list.innerHTML = '';

            if (comments.length === 0) {
                list.innerHTML = '<div class="p-6 text-center text-xs text-gray-400">   .<br>     !</div>';
                return;
            }

            comments.forEach((c, idx) => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-gray-50/70 rounded-xl border border-gray-100 space-y-1';
                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-800">${c.nick}</span>
                        <span class="text-[10px] text-gray-400">${c.time}</span>
                    </div>
                    <p class="text-xs text-gray-700 leading-snug break-keep">${c.text}</p>
                    <div class="flex justify-end pt-0.5">
                        <button onclick="likeComment('fashion_style', ${idx})" class="text-[10px] text-gray-400 hover:text-pink-600 flex items-center space-x-1">
                            <span></span>
                            <span class="font-bold">${c.likes || 0}</span>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function submitComment() {
            const nickEl = document.getElementById('comment-nickname');
            const textEl = document.getElementById('comment-text');

            const nick = nickEl.value.trim() || '';
            const text = textEl.value.trim();

            if (!text) { alert('  !'); return; }

            const comments = getStoredComments('fashion_style');
            comments.unshift({
                nick: nick,
                time: ' ',
                text: text,
                likes: 0
            });

            localStorage.setItem('test_comments_fashion_style', JSON.stringify(comments));
            textEl.value = '';
            renderComments();
            alert('  !');
        }

        function likeComment(key, idx) {
            const comments = getStoredComments(key);
            if (comments[idx]) {
                comments[idx].likes = (comments[idx].likes || 0) + 1;
                localStorage.setItem('test_comments_' + key, JSON.stringify(comments));
                renderComments();
            }
        }

        function shareResult() {
            const url = window.location.href;
            const title = '  &    ';
            const text = '        !    !';

            if (navigator.share) {
                navigator.share({ title: title, text: text, url: url }).catch(() => {});
            } else {
                const dummy = document.createElement('textarea');
                document.body.appendChild(dummy);
                dummy.value = `${text}\n${url}`;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                alert('  !   DM  .');
            }
        }
    </script>
</body>
</html>
