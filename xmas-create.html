<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-WRDDWJ26"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GT-WRDDWJ26');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>크리스마스 트리 꾸미기 만들기 | 테스트모음</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&family=Gowun+Dodum&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .radio-card:checked + div {
            border-color: #10b981;
            background-color: rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex justify-center bg-slate-900">
    <div class="w-full max-w-[480px] bg-slate-800 min-h-screen flex flex-col shadow-xl relative pb-16 px-5 pt-8">

        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-emerald-400 mb-2">나만의 크리스마스 트리 만들기</h1>
            <p class="text-sm text-slate-400 font-['Gowun_Dodum']">친구들에게 공유하고 크리스마스 당일에 편지를 받아보세요!</p>
        </div>

        <form id="create-form" class="space-y-6 flex-1">
            <div class="space-y-2">
                <label for="ownerName" class="block text-sm font-bold text-slate-300">트리 주인 이름 (닉네임)</label>
                <input type="text" id="ownerName" required maxlength="10" placeholder="예: 루돌프"
                    class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors">
            </div>

            <div class="space-y-3">
                <label class="block text-sm font-bold text-slate-300">트리 테마 선택</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="relative cursor-pointer">
                        <input type="radio" name="bgStyle" value="snowy" class="peer sr-only radio-card" checked>
                        <div class="border-2 border-slate-600 bg-slate-700 rounded-xl p-2 text-center transition-all peer-checked:border-emerald-500 peer-checked:bg-emerald-900/30">
                            <div class="w-full aspect-[3/4] rounded-lg bg-cover bg-center mb-2" style="background-image: url('./img/xmas_bg_snowy.webp');"></div>
                            <span class="text-xs font-bold text-slate-300 peer-checked:text-emerald-400">눈 내리는 밤</span>
                        </div>
                    </label>
                    <label class="relative cursor-pointer">
                        <input type="radio" name="bgStyle" value="warm" class="peer sr-only radio-card">
                        <div class="border-2 border-slate-600 bg-slate-700 rounded-xl p-2 text-center transition-all peer-checked:border-emerald-500 peer-checked:bg-emerald-900/30">
                            <div class="w-full aspect-[3/4] rounded-lg bg-cover bg-center mb-2" style="background-image: url('./img/xmas_bg_warm.webp');"></div>
                            <span class="text-xs font-bold text-slate-300 peer-checked:text-emerald-400">따뜻한 벽난로</span>
                        </div>
                    </label>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-lg py-4 rounded-xl mt-6 transition-colors shadow-[0_4px_14px_0_rgba(16,185,129,0.39)]">
                트리 생성하기
            </button>
        </form>

        <p id="debugMsg" class="text-xs text-slate-500 text-center mt-4 hidden"></p>

    </div>

    <script>
        var debugEl = document.getElementById('debugMsg');
        function debug(msg) {
            debugEl.classList.remove('hidden');
            debugEl.textContent = msg;
        }

        // Supabase 초기화
        var sb;
        try {
            sb = window.supabase.createClient(
                'https://fcuenflxkkpyplehsizg.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjdWVuZmx4a2tweXBsZWhzaXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MTU5NjgsImV4cCI6MjA4NTA5MTk2OH0.xfAV9dpBkhh-5FgV0uwCw8DO3EGqFNeoQrENldaqa8c'
            );
        } catch (initErr) {
            debug('DB 초기화 실패: ' + initErr.message);
        }

        document.getElementById('create-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            var ownerName = document.getElementById('ownerName').value.trim();
            var bgStyle = document.querySelector('input[name="bgStyle"]:checked').value;
            var submitBtn = document.getElementById('submitBtn');

            if (!ownerName) { alert('이름을 입력해주세요!'); return; }

            submitBtn.disabled = true;
            submitBtn.textContent = '생성 중...';
            debug('트리 생성 요청 중...');

            try {
                var treeId = crypto.randomUUID();
                debug('UUID 생성 완료: ' + treeId.substring(0, 8) + '...');

                var result = await sb.from('xmas_trees').insert({
                    id: treeId,
                    owner_name: ownerName,
                    tree_style: 'ai_image',
                    bg_style: bgStyle
                });

                debug('DB 응답: ' + JSON.stringify(result.error || 'OK'));

                if (result.error) {
                    throw new Error(result.error.message || JSON.stringify(result.error));
                }

                localStorage.setItem('my_xmas_tree_id', treeId);
                window.location.href = '/xmas-view.html?id=' + treeId;

            } catch (err) {
                debug('오류: ' + (err.message || String(err)));
                alert('트리 생성에 실패했습니다.\n' + (err.message || ''));
                submitBtn.disabled = false;
                submitBtn.textContent = '트리 생성하기';
            }
        });
    </script>
</body>
</html>
