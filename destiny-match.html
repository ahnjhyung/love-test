    <script>
        function fillDates(yId, mId, dId, defYear) {
            const ys = document.getElementById(yId);
            const ms = document.getElementById(mId);
            const ds = document.getElementById(dId);

            for (let y = 2012; y >= 1950; y--) {
                const o = document.createElement('option');
                o.value = y; o.textContent = y + '';
                if (y === defYear) o.selected = true;
                ys.appendChild(o);
            }
            for (let m = 1; m <= 12; m++) {
                const o = document.createElement('option');
                o.value = m; o.textContent = m + '';
                ms.appendChild(o);
            }
            for (let d = 1; d <= 31; d++) {
                const o = document.createElement('option');
                o.value = d; o.textContent = d + '';
                ds.appendChild(o);
            }
        }
        fillDates('p1-year', 'p1-month', 'p1-day', 1998);
        fillDates('p2-year', 'p2-month', 'p2-day', 1999);

        function showScreen(id) {
            ['start-screen', 'input-screen', 'loading-screen', 'result-screen'].forEach(s => {
                const el = document.getElementById(s);
                if (el) el.classList.add('hidden');
            });
            const t = document.getElementById(id);
            if (t) {
                t.classList.remove('hidden');
                if (id === 'loading-screen') t.classList.add('flex');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function calcJDN(year, month, day) {
            return Math.floor((1461 * (year + 4800 + Math.floor((month - 14) / 12))) / 4)
                + Math.floor((367 * (month - 2 - 12 * Math.floor((month - 14) / 12))) / 12)
                - Math.floor((3 * Math.floor((year + 4900 + Math.floor((month - 14) / 12)) / 100)) / 4)
                + day - 32075;
        }

        const CHEONGAN_OHAENG = ['','','','','','','','','',''];
        const CHEONGAN_NAME = ['()', '()', '()', '()', '()', '()', '()', '()', '()', '()'];

        function calculateMatch() {
            const p1Name = document.getElementById('p1-name').value.trim() || '';
            const p2Name = document.getElementById('p2-name').value.trim() || '';

            const y1 = parseInt(document.getElementById('p1-year').value);
            const m1 = parseInt(document.getElementById('p1-month').value);
            const d1 = parseInt(document.getElementById('p1-day').value);

            const y2 = parseInt(document.getElementById('p2-year').value);
            const m2 = parseInt(document.getElementById('p2-month').value);
            const d2 = parseInt(document.getElementById('p2-day').value);

            showScreen('loading-screen');

            setTimeout(() => {
                const jdn1 = calcJDN(y1, m1, d1);
                const jdn2 = calcJDN(y2, m2, d2);

                const gan1 = (jdn1 + 9) % 10;
                const gan2 = (jdn2 + 9) % 10;

                //   (0-5 , 1-6 , 2-7 , 3-8 , 4-9 )
                const isCheonganHab = (Math.abs(gan1 - gan2) === 5);
                
                let baseScore = 75;
                if (isCheonganHab) baseScore = 95;
                else {
                    const diff = Math.abs(gan1 - gan2);
                    baseScore = 70 + ((jdn1 + jdn2) % 25);
                }

                document.getElementById('res-p1').textContent = p1Name;
                document.getElementById('res-p2').textContent = p2Name;
                document.getElementById('res-score').textContent = baseScore + '';

                let title = '    ';
                let tags = ['#', '#', '#'];
                let summary = `${p1Name}(${CHEONGAN_NAME[gan1]}) ${p2Name}(${CHEONGAN_NAME[gan2]})         .`;
                let detail = `               .         .`;
                let point = '      ';
                let advice = '       ';

                if (baseScore >= 90) {
                    title = '   !';
                    tags = ['#', '#', '#', '#'];
                    summary = `       .           .`;
                    detail = `       .           .`;
                    point = '    ';
                    advice = '       ';
                } else if (baseScore < 80) {
                    title = '     ';
                    tags = ['#', '#', '#'];
                    summary = `        .       .`;
                    detail = `         ,          .`;
                    point = '    ';
                    advice = '       ';
                }

                document.getElementById('res-title').textContent = title;
                document.getElementById('res-summary').textContent = summary;
                document.getElementById('res-detail').textContent = detail;
                document.getElementById('res-point').textContent = point;
                document.getElementById('res-advice').textContent = advice;

                const tagsEl = document.getElementById('res-tags');
                tagsEl.innerHTML = '';
                tags.forEach(t => {
                    const sp = document.createElement('span');
                    sp.className = 'bg-white border border-purple-100 px-2 py-0.5 rounded text-[11px] text-purple-700 shadow-2xs';
                    sp.textContent = t;
                    tagsEl.appendChild(sp);
                });

                renderComments();
                showScreen('result-screen');
            }, 1000);
        }

        function getStoredComments(key) {
            const stored = localStorage.getItem('test_comments_' + key);
            if (stored) {
                try { return JSON.parse(stored); } catch(e) {}
            }
            return [];
        }

        function renderComments() {
            const list = document.getElementById('comment-list');
            if (!list) return;
            const comments = getStoredComments('destiny_match');
            list.innerHTML = '';

            if (comments.length === 0) {
                list.innerHTML = '<div class="p-6 text-center text-xs text-gray-400">   .<br>     !</div>';
                return;
            }

            comments.forEach((c, idx) => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-gray-50/70 rounded-xl border border-gray-100 space-y-1';
                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-800">${c.nick}</span>
                        <span class="text-[10px] text-gray-400">${c.time}</span>
                    </div>
                    <p class="text-xs text-gray-700 leading-snug break-keep">${c.text}</p>
                    <div class="flex justify-end pt-0.5">
                        <button onclick="likeComment('destiny_match', ${idx})" class="text-[10px] text-gray-400 hover:text-purple-600 flex items-center space-x-1">
                            <span></span>
                            <span class="font-bold">${c.likes || 0}</span>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function submitComment() {
            const nickEl = document.getElementById('comment-nickname');
            const textEl = document.getElementById('comment-text');

            const nick = nickEl.value.trim() || '';
            const text = textEl.value.trim();

            if (!text) { alert('  !'); return; }

            const comments = getStoredComments('destiny_match');
            comments.unshift({
                nick: nick,
                time: ' ',
                text: text,
                likes: 0
            });

            localStorage.setItem('test_comments_destiny_match', JSON.stringify(comments));
            textEl.value = '';
            renderComments();
            alert('  !');
        }

        function likeComment(key, idx) {
            const comments = getStoredComments(key);
            if (comments[idx]) {
                comments[idx].likes = (comments[idx].likes || 0) + 1;
                localStorage.setItem('test_comments_' + key, JSON.stringify(comments));
                renderComments();
            }
        }

        function copyShareLink() {
            const url = window.location.href;
            const title = '     ';
            const text = '      ?   !';

            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: text,
                    url: url
                }).catch(() => {});
            } else {
                const dummy = document.createElement('textarea');
                document.body.appendChild(dummy);
                dummy.value = `${text}\n${url}`;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                alert('   !   DM .');
            }
        }
    </script>
