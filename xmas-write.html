<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-WRDDWJ26"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GT-WRDDWJ26');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>크리스마스 편지 쓰기 | 테스트모음</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&family=Gowun+Dodum&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .ornament-card { transition: all 0.2s; }
        .ornament-card.selected { border-color: #ef4444; background-color: rgba(239, 68, 68, 0.15); transform: scale(1.05); }
    </style>
</head>
<body class="min-h-screen flex justify-center bg-slate-900">
    <div class="w-full max-w-[480px] bg-slate-800 min-h-screen flex flex-col shadow-xl relative pb-16 px-5 pt-8">

        <div class="text-center mb-6">
            <h1 class="text-xl font-black text-white mb-2">
                <span id="display-owner" class="text-red-400">...</span>님의 트리에<br>편지를 달아주세요!
            </h1>
            <p class="text-xs text-slate-400 font-['Gowun_Dodum']">작성하신 편지는 12월 25일에만 열어볼 수 있어요.</p>
        </div>

        <form id="write-form" class="space-y-5 flex-1">

            <!-- 오너먼트 선택 (AI 이미지) -->
            <div class="space-y-3">
                <label class="block text-sm font-bold text-slate-300">장식 선택</label>
                <div class="grid grid-cols-4 gap-2" id="ornament-grid">
                    <div class="ornament-card border-2 border-slate-600 bg-slate-700 rounded-xl p-2 cursor-pointer selected" data-type="star">
                        <img src="./img/ornament_star.jpg" alt="별" class="w-full aspect-square rounded-lg object-cover">
                        <p class="text-[10px] text-center text-slate-300 mt-1 font-bold">별</p>
                    </div>
                    <div class="ornament-card border-2 border-slate-600 bg-slate-700 rounded-xl p-2 cursor-pointer" data-type="bauble">
                        <img src="./img/ornament_bauble.jpg" alt="방울" class="w-full aspect-square rounded-lg object-cover">
                        <p class="text-[10px] text-center text-slate-300 mt-1 font-bold">방울</p>
                    </div>
                    <div class="ornament-card border-2 border-slate-600 bg-slate-700 rounded-xl p-2 cursor-pointer" data-type="candy">
                        <img src="./img/ornament_candy.jpg" alt="사탕" class="w-full aspect-square rounded-lg object-cover">
                        <p class="text-[10px] text-center text-slate-300 mt-1 font-bold">사탕</p>
                    </div>
                    <div class="ornament-card border-2 border-slate-600 bg-slate-700 rounded-xl p-2 cursor-pointer" data-type="gift">
                        <img src="./img/ornament_gift.jpg" alt="선물" class="w-full aspect-square rounded-lg object-cover">
                        <p class="text-[10px] text-center text-slate-300 mt-1 font-bold">선물</p>
                    </div>
                </div>
            </div>

            <!-- 보내는 사람 -->
            <div class="space-y-2">
                <label for="authorName" class="block text-sm font-bold text-slate-300">보내는 사람 (익명 가능)</label>
                <input type="text" id="authorName" required maxlength="10" placeholder="예: 산타할아버지"
                    class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500">
            </div>

            <!-- 편지 내용 -->
            <div class="space-y-2">
                <label for="content" class="block text-sm font-bold text-slate-300">따뜻한 편지 한마디</label>
                <textarea id="content" required rows="4" maxlength="200" placeholder="메리 크리스마스! 올 한 해 고생 많았어 :)"
                    class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 resize-none font-['Gowun_Dodum'] text-sm leading-relaxed"></textarea>
                <div class="text-right text-xs text-slate-500">최대 200자</div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold text-lg py-4 rounded-xl mt-4 transition-colors shadow-[0_4px_14px_0_rgba(239,68,68,0.39)]">
                트리에 편지 달기
            </button>
        </form>
    </div>

    <script>
        var sb = window.supabase.createClient(
            'https://fcuenflxkkpyplehsizg.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjdWVuZmx4a2tweXBsZWhzaXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MTU5NjgsImV4cCI6MjA4NTA5MTk2OH0.xfAV9dpBkhh-5FgV0uwCw8DO3EGqFNeoQrENldaqa8c'
        );

        var urlParams = new URLSearchParams(window.location.search);
        var treeId = urlParams.get('id');
        var selectedOrnament = 'star';

        if (!treeId) {
            alert('잘못된 접근입니다.');
            window.location.href = '/';
        }

        // 장식 선택 로직
        document.querySelectorAll('.ornament-card').forEach(function(card) {
            card.addEventListener('click', function() {
                document.querySelectorAll('.ornament-card').forEach(function(c) { c.classList.remove('selected'); });
                card.classList.add('selected');
                selectedOrnament = card.getAttribute('data-type');
            });
        });

        // 트리 주인 닉네임 로드
        async function loadTreeInfo() {
            try {
                var result = await sb.from('xmas_trees').select('owner_name').eq('id', treeId).single();
                if (result.error || !result.data) {
                    alert('존재하지 않는 트리입니다.');
                    window.location.href = '/';
                    return;
                }
                document.getElementById('display-owner').textContent = result.data.owner_name;
            } catch (err) {
                console.error('loadTreeInfo error:', err);
            }
        }
        loadTreeInfo();

        // 폼 제출
        document.getElementById('write-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            var author = document.getElementById('authorName').value.trim();
            var text = document.getElementById('content').value.trim();
            var submitBtn = document.getElementById('submitBtn');

            if (!author || !text) { alert('모두 입력해주세요.'); return; }

            // 트리 위에 랜덤 위치 (x: 15~85%, y: 15~80%)
            var posX = 15 + Math.random() * 70;
            var posY = 15 + Math.random() * 65;

            submitBtn.disabled = true;
            submitBtn.textContent = '장식 다는 중...';

            try {
                var result = await sb.from('xmas_messages').insert({
                    tree_id: treeId,
                    author_name: author,
                    content: text,
                    ornament_type: selectedOrnament,
                    ornament_color: 'default',
                    position_x: posX,
                    position_y: posY
                });

                if (result.error) throw new Error(result.error.message);

                alert('트리에 장식이 예쁘게 달렸습니다!');
                window.location.href = '/xmas-view.html?id=' + treeId;

            } catch (err) {
                console.error(err);
                alert('오류가 발생했습니다. 다시 시도해주세요.\n' + (err.message || ''));
                submitBtn.disabled = false;
                submitBtn.textContent = '트리에 편지 달기';
            }
        });
    </script>
</body>
</html>
